<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabelPrompt 设置</title>
    <style>
        :root {
            --primary-color: #667eea;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--primary-color);
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }
        .input-wrapper {
            position: relative;
        }
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            padding-right: 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .toggle-visibility {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            padding: 5px;
        }
        .toggle-visibility:hover {
            color: var(--primary-color);
        }
        .hint {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.5rem;
            line-height: 1.4;
        }
        .hint a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .hint a:hover {
            text-decoration: underline;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #5568d3;
        }
        button.secondary {
            background-color: #e5e7eb;
            color: #374151;
        }
        button.secondary:hover {
            background-color: #d1d5db;
        }
        /* 自定义 Toast 提示 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
        #toast.success {
            background-color: #10b981;
        }
        #toast.error {
            background-color: #ef4444;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: #1565c0;
        }
        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 1.5rem 0;
        }
        .current-config {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #6b7280;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.875rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d1d5db;
        }
        .status-dot.configured {
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .status-dot.not-configured {
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BabelPrompt 设置</h1>
        <p class="subtitle">配置你的 API Key 以启用提示词优化功能</p>

        <div class="info-box">
            你的 API Key 仅存储在本地浏览器中，不会上传至任何服务器（除了 ZhipuAI 官方 API）。
        </div>

        <div class="form-group">
            <label for="apiKey">ZhipuAI API Key</label>
            <div class="input-wrapper">
                <input type="password" id="apiKey" placeholder="输入你的 ZhipuAI API Key" autocomplete="off">
                <button type="button" class="toggle-visibility" id="toggleVisibility" title="显示/隐藏">
                    👁️
                </button>
            </div>
            <div class="hint">
                从 <a href="https://open.bigmodel.cn/" target="_blank">open.bigmodel.cn</a> 获取你的 API Key
            </div>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">检查中...</span>
            </div>
        </div>

        <div class="form-group">
            <label for="apiModel">AI 模型（可选）</label>
            <input type="text" id="apiModel" placeholder="claude-3-sonnet-20240229" value="claude-3-sonnet-20240229">
            <div class="hint">默认使用 Claude 3 Sonnet，你可以更改为其他模型</div>
        </div>

        <div class="btn-group">
            <button id="saveBtn">保存设置</button>
            <button id="testBtn" class="secondary">测试连接</button>
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label>当前配置</label>
            <div class="current-config" id="currentConfig">
                加载中...
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="settings.js"></script>
</body>
</html>
