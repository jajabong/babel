<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Test Page - Claude Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .chat-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 300px;
        }
        .message {
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 8px;
            max-width: 80%;
        }
        .message.user {
            background: #e8f0fe;
            margin-left: auto;
        }
        .message.assistant {
            background: #f1f3f4;
        }
        .input-area {
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .input-wrapper {
            position: relative;
        }
        [contenteditable="true"] {
            min-height: 60px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            line-height: 1.5;
        }
        [contenteditable="true"]:focus {
            border-color: #1a73e8;
        }
        .send-button {
            margin-top: 10px;
            padding: 10px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .send-button:hover {
            background: #1557b0;
        }
        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 13px;
        }
        .status.info {
            background: #e8f0fe;
            color: #1967d2;
        }
        .status.success {
            background: #ceead6;
            color: #137333;
        }
    </style>
</head>
<body>
    <h1>🧪 LLM Test Page - Claude Simulator</h1>
    <p style="color: #666;">用于测试 BabelPrompt 扩展的模拟 LLM 页面</p>

    <div class="status info">
        <strong>测试说明:</strong>
        <ul>
            <li>此页面模拟 Claude.ai 的输入框和提交按钮</li>
            <li>Contenteditable div 模拟 Claude 的输入区域</li>
            <li>按钮包含 aria-label="Send message" 属性</li>
        </ul>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <strong>Assistant:</strong> 你好！我是模拟的 Claude AI。你可以在下方输入框中输入内容，然后点击发送按钮来测试 BabelPrompt 扩展的注入功能。
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <div id="promptInput" contenteditable="true" data-placeholder="输入消息..."></div>
        </div>
        <button id="sendBtn" class="send-button" aria-label="Send message">
            Send Message
        </button>
    </div>

    <script>
        const input = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');

        let messageCount = 0;

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = input.textContent.trim();
            if (!text) return;

            // 添加用户消息
            addMessage(text, 'user');
            input.textContent = '';

            // 模拟 AI 响应
            setTimeout(() => {
                const responses = [
                    '这是一个优化后的 prompt：\n\n请作为专业的软件工程师，帮我编写一个高效、可维护的 Python 爬虫程序。要求包括：\n1. 使用 requests 库进行 HTTP 请求\n2. 使用 BeautifulSoup 解析 HTML\n3. 实现错误处理和重试机制\n4. 添加适当的日志记录\n5. 遵循 PEP 8 代码规范',
                    '优化后的 prompt：\n\n设计一个现代化的前端组件，要求：\n- 使用 React Hooks\n- 支持深色模式\n- 响应式设计\n- 无障碍访问支持',
                    '这是你的优化 prompt：\n\n作为资深架构师，请设计一个微服务架构方案，涵盖：\n- 服务拆分原则\n- API 网关设计\n- 服务间通信\n- 数据一致性保障'
                ];
                const response = responses[messageCount % responses.length];
                addMessage(response, 'assistant');
                messageCount++;
            }, 500);
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `<strong>${type === 'user' ? 'You' : 'Assistant'}:</strong> ${text.replace(/\n/g, '<br>')}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 模拟输出区域（用于测试提取功能）
        const outputDiv = document.createElement('div');
        outputDiv.className = 'prose';
        outputDiv.style.cssText = 'display: none;';
        document.body.appendChild(outputDiv);

        console.log('LLM Test Page loaded - ready for BabelPrompt testing');
        console.log('Input element:', input);
        console.log('Send button:', sendBtn);
        console.log('Output element:', outputDiv);
    </script>
</body>
</html>
